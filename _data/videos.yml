# Vídeos explicativos da pesquisa (YouTube). Transcrições geradas a partir das legendas do próprio vídeo.
# Para esconder um vídeo do site, mude 'show' para false.

- id: ifaislm
  youtube: SxnnoGPIkSI
  poster: /assets/img/video-ifaislm.webp
  duration: "7:31"
  show: true
  en:
    title: "When is an AI system ready to move forward?"
    summary: "A framework that couples the AI lifecycle, technology readiness (MLTRL) and MLOps maturity, level by level, with an evidence-based gate procedure. It is the method behind ARM's governance work."
    takeaways:
      - "Three axes in one reference: 10 lifecycle stages, readiness levels 0 to 9 and 5 levels of MLOps maturity."
      - "A system is only as ready as its least mature part: the weakest-component rule."
      - "Applied to 4 real AI projects and evaluated by 12 experts, with 14 refinements."
    transcript: "This video presents a framework to answer a question every artificial intelligence team faces: when is an AI system actually ready to move forward? Getting past the prototype is still hard. Gartner predicted that at least 30% of generative AI projects would be abandoned after the proof of concept. And, according to McKinsey, 88% of organisations already use AI, but almost two thirds have not yet started to scale. So whoever manages an AI portfolio has to decide, again and again, whether a project moves forward, waits or goes back to an earlier stage. And there is no shared way of knowing what being ready means. Three bodies of knowledge address this, each on its own. Process models say what to do, such as CRISP-DM and ISO/IEC 5338. Readiness scales say how mature the technology is, such as TRL and MLTRL. And operational maturity models say how industrialised the operation is, such as the MLOps levels. Each is useful on its own, but none says how a lifecycle stage relates to a readiness level, or to the operational maturity required. Comparing the closest frameworks, each column is well served by one of them, and none serves them all. To fill this gap, the study used design science research (DSR): design an artefact and evaluate it rigorously. The framework was applied to 4 real AI projects, 12 experts evaluated the results, and the evaluation produced 14 refinements. The first axis is a lifecycle with 10 stages, from business understanding to the impact of use. They are iterative workstreams, not steps in a straight line. And ethics, fairness and accountability do not sit in a single stage: they cut across all of them. The second axis is the MLTRL readiness scale, with 10 levels, from 0 to 9: early research, maturing research, development and deployment. Two points concentrate the risk: level 4, the decision after the proof of concept, and level 5, the passage from research to product, the so-called valley of death. The third axis is operational maturity, in 5 levels: initial, repeatable, reliable, scalable and optimised. Two jumps matter. From the first to the second, craft work becomes reproducible team practice on shared infrastructure, in the cloud or on premises. And from the third to the fourth, industrial-scale portfolio management emerges, with drift monitoring. The framework couples the three axes level by level. For each readiness level, it states which stages dominate, which deliverables prove the level and which band of operational maturity the project needs. Notice: it is a band, not a point. It is narrow at the ends and widens in the middle of the scale, where projects diverge according to whether they intend to reach production. In practice, the assessment follows four steps. First, characterise the project. Second, assess readiness component by component. Third, assess the operational maturity available. And fourth, identify and classify the gaps. The first mechanism is the weakest-component rule. A system is only as ready as its least mature part. If the model is at level 5, the data at 4 and the software at 3, the system is at level 3. The second is the scope calibration guideline. What is required must be proportional to the declared readiness and to the project's intent. Requiring production infrastructure from research with no production intent is a mistake. And a project that wants to reach production cannot claim readiness without the operational foundation. The third is a gap taxonomy, which turns the verdict into a work plan. A scope gap blocks progress. A documentation gap only asks to consolidate the record, without redoing the work. And a future prerequisite is left to whoever owns the next stage. Partial evidence does not close a gap. Two guidelines complete the procedure. Under conservative classification, if the artefact exists but is incomplete or ambiguous, the gap stays open. And going back to an earlier level is healthy when it comes from a discovery, such as a domain shift. But it is a symptom of failure when it reveals that intermediate levels were skipped. For systems with generative AI, there is a security gate as early as level 4 (TRL 4), at the proof of concept. Before moving forward, the system must have tests against prompt injection and semantic validation of the generated answers, with a list of 7 checks. The framework was applied to 4 projects. A heart-sound classifier, confirmed at level 4, with its scope calibrated for research. A maritime search and rescue system, downgraded to level 3. A generative AI assistant and an industrial system which, lacking tests against prompt injection, were reclassified to level 3 in the revised version. The revision also graded the artefacts. A small regression set at level 3 becomes the continuous integration golden dataset at level 7. Service level objectives at level 6 become signed agreements at level 8. And there is one exception: the datasheet, with origin, licence and lineage, is required from the first contact with the data, because provenance that is not recorded at acquisition cannot be reconstructed later. The 12 experts recognised the problem: 11 out of 12 agreed that the lack of shared criteria harms decisions. The weakest-component rule was the best rated, with 9 top scores. And the 34 comments became 23 proposals: 16 incorporated, 4 rejected with justification and 3 left for future work. For managers, the framework works as a layer over the gates, compatible with agile methods, and not as a new process. The scope guideline protects both sides of the portfolio: research stays free of production requirements, and those who want to reach production do not skip the operational foundation. The limits are stated. The panel is small and concentrated in technology and research. The evidence on the highest levels, 7 to 9, is the weakest. And the authors themselves applied the framework, so the experts evaluated the syntheses, not an independent application. In short: the study treats readiness not as a number to estimate, but as a claim that requires inspectable evidence at each level. The next step is to apply the framework prospectively, at real gates. The takeaway: being ready is not a number, it is evidence that can be verified. Thank you for watching."
  pt:
    title: "Quando um sistema de IA está pronto para avançar?"
    summary: "Um framework que acopla o ciclo de vida de IA, a prontidão tecnológica (MLTRL) e a maturidade de MLOps, nível a nível, com um procedimento de portão baseado em evidências. É o método por trás do trabalho de governança da ARM."
    takeaways:
      - "Três eixos numa só referência: 10 etapas do ciclo de vida, prontidão de 0 a 9 e 5 níveis de maturidade de MLOps."
      - "Um sistema só é tão pronto quanto a sua parte menos madura: a regra do componente mais fraco."
      - "Aplicado a 4 projetos reais de IA e avaliado por 12 especialistas, com 14 refinamentos."
    transcript: "Este vídeo apresenta um framework para responder a uma pergunta que toda equipe de inteligência artificial enfrenta: quando um sistema de IA está, de fato, pronto para avançar? Sair do protótipo continua difícil. O Gartner previu que pelo menos 30% dos projetos de IA generativa seriam abandonados depois da prova de conceito. E, segundo a McKinsey, 88% das organizações já usam IA, mas quase 2/3 ainda não começaram a escalar. Por isso, quem gerencia um portfólio de IA precisa decidir, de novo e de novo, se um projeto avança, espera ou volta para uma etapa anterior. E falta um jeito compartilhado de saber o que significa estar pronto. Três corpos de conhecimento tratam disso, cada um por conta própria. Os modelos de processo dizem o que fazer, como o CRISP-DM e a ISO/IEC 5338. As escalas de prontidão dizem quão madura está a tecnologia, como o TRL e o MLTRL. E os modelos de maturidade operacional dizem quão industrializada está a operação, como os níveis de MLOps. Cada um é útil sozinho, mas nenhum diz como uma etapa do ciclo de vida se relaciona com um nível de prontidão, nem com a maturidade operacional necessária. Comparando os frameworks mais próximos, cada coluna é bem atendida por algum deles, e nenhum atende a todas. Para preencher essa lacuna, o estudo usou a pesquisa em ciência do design (DSR): projetar um artefato e avaliá-lo com rigor. O framework foi aplicado a 4 projetos reais de IA, 12 especialistas avaliaram os resultados, e a avaliação gerou 14 refinamentos. O primeiro eixo é um ciclo de vida com 10 etapas, do entendimento do negócio ao impacto do uso. Elas são frentes de trabalho iterativas, não passos em linha reta. E ética, justiça e responsabilização não ficam numa etapa só: atravessam todas. O segundo eixo é a escala de prontidão do MLTRL, com 10 níveis, de 0 a 9: pesquisa inicial, pesquisa em amadurecimento, desenvolvimento e implantação. Dois pontos concentram o risco: o nível 4, a decisão depois da prova de conceito, e o nível 5, a passagem da pesquisa para o produto, o chamado vale da morte. O terceiro eixo é a maturidade operacional, em 5 níveis: inicial, repetível, confiável, escalável e otimizado. Dois saltos importam. Do primeiro para o segundo, o trabalho artesanal vira prática de equipe, reprodutível, em infraestrutura compartilhada, na nuvem ou na própria empresa. E do terceiro para o quarto, surge a gestão de portfólio em escala industrial, com monitoramento de deriva. O framework acopla os três eixos nível a nível. Para cada nível de prontidão, ele diz quais etapas dominam, quais entregas comprovam o nível e qual faixa de maturidade operacional o projeto precisa. Repare: é uma faixa, não um ponto. Ela é estreita nas pontas e se alarga no meio da escala, onde os projetos divergem pela intenção de chegar à produção. Na prática, a avaliação segue quatro passos. Primeiro, caracterizar o projeto. Segundo, avaliar a prontidão componente a componente. Terceiro, avaliar a maturidade operacional disponível. E quarto, identificar e classificar as lacunas. O primeiro mecanismo é a regra do componente mais fraco. Um sistema só é tão pronto quanto a sua parte menos madura. Se o modelo está no nível 5, os dados no 4 e o software no 3, o sistema está no nível 3. O segundo é a diretriz de calibração de escopo. O que se exige deve ser proporcional à prontidão declarada e à intenção do projeto. Exigir infraestrutura de produção de uma pesquisa sem intenção de produção é um erro. E um projeto que quer chegar à produção não pode alegar prontidão sem a base operacional. O terceiro é uma taxonomia de lacunas, que transforma o veredito num plano de trabalho. A lacuna de escopo bloqueia o avanço. A lacuna documental pede só consolidar o registro, sem refazer o trabalho. E o pré-requisito futuro fica para o responsável pela etapa seguinte. Evidência parcial não fecha lacuna. Duas diretrizes completam o procedimento. Pela classificação conservadora, se o artefato existe mas está incompleto ou ambíguo, a lacuna continua aberta. E o retorno a um nível anterior é saudável quando nasce de uma descoberta, como uma mudança de domínio. Mas é sintoma de falha quando revela que níveis intermediários foram pulados. Para sistemas com IA generativa, há um portão de segurança já no nível 4 (TRL 4), na prova de conceito. Antes de avançar, o sistema precisa ter testes contra injeção de instruções (prompt injection) e validação semântica das respostas geradas, com uma lista de 7 verificações. O framework foi aplicado a 4 projetos. Um classificador de áudio cardíaco, confirmado no nível 4, com o escopo calibrado para a pesquisa. Um sistema de busca e salvamento marítimo, rebaixado para o nível 3. Um assistente de IA generativa e um sistema industrial que, sem testes contra injeção de instruções, foram reclassificados para o nível 3 na versão revisada. A revisão também graduou os artefatos. Um pequeno conjunto de regressão no nível 3 vira o conjunto de referência da integração contínua no nível 7. Objetivos de serviço no nível 6 viram acordos firmados no nível 8. E há uma exceção: a ficha de dados, com origem, licença e linhagem, é exigida desde o primeiro contato com os dados, porque a proveniência que não é registrada na aquisição não se reconstrói depois. Os 12 especialistas reconheceram o problema: 11 de 12 concordaram que a falta de critérios compartilhados prejudica as decisões. A regra do componente mais fraco foi a mais bem avaliada, com 9 notas máximas. E os 34 comentários viraram 23 propostas: 16 incorporadas, 4 rejeitadas com justificativa e 3 para trabalhos futuros. Para os gestores, o framework funciona como uma camada sobre os portões, compatível com métodos ágeis, e não como um novo processo. A diretriz de escopo protege os dois lados do portfólio: a pesquisa fica livre de exigências de produção, e quem quer chegar à produção não pula a base operacional. Os limites são declarados. O painel é pequeno e concentrado em tecnologia e pesquisa. A evidência sobre os níveis mais altos, de 7 a 9, é a mais fraca. E os próprios autores aplicaram o framework, então os especialistas avaliaram as sínteses, não uma aplicação independente. Resumindo: o estudo trata a prontidão não como um número a estimar, mas como uma afirmação que exige evidência inspecionável em cada nível. O próximo passo é aplicar o framework de forma prospectiva, em portões reais. Para levar: estar pronto não é um número, é uma evidência que se pode verificar. Obrigada pela atenção."
- id: ciclo-ia
  youtube: FWAbmWO2WKg
  poster: /assets/img/video-ciclo-ia.webp
  duration: "8:35"
  show: true
  en:
    title: "Beyond the proof of concept: a review of AI lifecycle frameworks"
    summary: "Why do so many AI projects stall right after the proof of concept? A systematic review of 44 AI lifecycle frameworks shows where guidance converges and where it falls short."
    takeaways:
      - "44 proposals harmonised into 10 stages and 23 activities."
      - "The technical core is well covered; management, lineage, testing, documentation and model governance are not."
      - "A gate framework that requires management evidence, not just model performance."
    transcript: "This video explains a study about a problem many people who work with artificial intelligence know well: the path between a proof of concept and AI that works every day. Many AI projects stall right after the proof of concept. Gartner even predicted that at least 30% of generative AI projects would be abandoned at that stage by the end of 2025. And the obstacle is rarely the model: it is everything around it. Keeping a model monitored and aligned with the business can cost far more than the model code itself. This is the so-called hidden technical debt. Taking a technology from pilot to reliable use is an old problem in technology management. That is what stage-gate processes, technology readiness levels (TRL) and ISO 56002 are for. But AI makes this problem harder: its behaviour changes when the data changes, and much of the value and the risk appear after launch. That is why AI needs management across its whole lifecycle. There are already several frameworks for this path, such as CRISP-ML(Q), MLOps, MLTRL, the NIST AI RMF and ISO/IEC 42001. But they do not fit together: they mix levels and define the phases in different ways. And nobody had checked which stages get practical guidance and which are left vague. This study did that, with four questions. Which frameworks exist? How do they organise stages and activities? Where does guidance converge and where does it fall short? And how does this change across sectors? To analyse these frameworks, the study uses two lenses. The first is dynamic capabilities: to sustain the value of AI, an organisation must sense change, seize opportunities and transform itself when conditions change. The second is boundary objects: shared artefacts, such as requirements and documentation, that let the technical, business, management and audit areas work together. Now, how the study was done. The review followed the PRISMA protocol. The searches were run in June 2025 in Scopus, OpenAlex and Crossref, covering studies from 2020 onwards. That gave 3,467 records. A statistical filter kept 705. A language model did a first screening, and every inclusion or doubt went through manual review. In the end, screening kept 26 studies, citation searching added 16, and the authors included 2 more. That makes 44 proposals. First question: what exists? There are 4 syntheses, 9 domain-specific applications and 31 conceptual models. The largest family is governance frameworks, which talk more about principles than about the mechanisms to enforce them. And validation is weak: only 7 of the 44 studies were validated beyond a single case. Second question: how is the work organised? Harmonising the 44 proposals, the study arrived at 10 stages and 23 activities, from business understanding to monitoring and the impact of use. Three feedback loops recur: the impact of use revises the requirements, model evaluation revises the data, and drift detected in monitoring triggers retraining. But these loops appear as intentions. Rarely does anyone say who runs them, how, and with which artefact. Third question, and the heart of the study: where does guidance converge and where does it fall short? Coverage splits into three bands. At the centre, the technical core, almost saturated: deployment in 98% of the proposals, evaluation in 93% and training in 91%. Around it, a perimeter of data and responsibility: data preparation, fairness and bias, and monitoring, at 80% each. And on the periphery, the neglected activities, covered by less than a third of the proposals. Dedicated management: 9%. Data lineage: 14%. Inference and optimisation: 20%. Testing: 25%. Documentation: 27%. Model governance: 32%. Notice: these are exactly the activities that keep a model working after delivery. There is also a normative asymmetry. Fairness and bias have 80% coverage; model governance, only 32%. Responsible AI principles appear in most proposals, but the policies and audit evidence that would enforce them appear in less than a third. Fourth question: do sectors change this picture? They change the emphasis, not the stages. Regulated sectors focus on compliance evidence. In healthcare, equity and decommissioning come in. In finance, documentation becomes model risk management. And in generative AI, practice changes within the stages, with human evaluation, red teaming and risks such as prompt injection. What does this mean for those who manage AI? First: the stall after the proof of concept coincides with a guidance gap. The least covered stages are exactly those where practitioners report the most friction. The study measured the literature, not cause and effect, but the pattern is clear. Through the lens of dynamic capabilities: seizing is strong on the technical side and weak on integration, sensing is uneven, and transforming comes down almost entirely to monitoring and retraining. In other words, adopting a framework does not deliver a ready-made management layer. It has to be designed. Second: the gaps share the same structure. They appear where information and accountability cross boundaries between areas. And each boundary calls for a standardised artefact that serves as evidence. A metric translation log, from business to the technical team. An assurance case, from standards to engineering. A monitoring contract, from testing to real-world use. And an evidence package, from development to audit. Hence the study's proposal: a gate framework that couples technical maturity with governance. At the bottom, the technical progression of MLTRL, from proof of concept to sustained operation. At the top, the routines of the ISO/IEC 42001 management system: plan, do, check and act. And in between, three gates. From proof of concept to pilot: the metric translation log and the initial assurance scope. From pilot to production: the assurance case and the evidence package. And in sustained operation: the monitoring contract and the reconfiguration and retirement log. The rule is simple: each gate requires management evidence, not just model performance. Every study has limits. Harmonising terms involves interpretation. Automated screening may introduce bias, although a sample was checked by hand. The search used lifecycle terms, and management studies indexed differently may have been missed. And the gate framework has not yet been validated in practice. In short: 44 proposals, 10 stages and 23 activities. The field converges on technical modelling and leaves management, documentation, lineage and governance underspecified. The next step is to validate the gates in real organisations. The takeaway: a model that passes the proof of concept is not yet AI that works every day. What makes that transition happen is management evidence. Thank you for watching."
  pt:
    title: "Além da prova de conceito: uma revisão dos frameworks de ciclo de vida de IA"
    summary: "Por que tantos projetos de IA param logo depois da prova de conceito? Uma revisão sistemática de 44 frameworks de ciclo de vida de IA mostra onde a orientação converge e onde ela falha."
    takeaways:
      - "44 propostas harmonizadas em 10 etapas e 23 atividades."
      - "O núcleo técnico é bem coberto; gestão, linhagem, testes, documentação e governança de modelos, não."
      - "Um framework de portões que exige evidências de gestão, e não só o desempenho do modelo."
    transcript: "Este vídeo explica um estudo sobre um problema que muita gente que trabalha com inteligência artificial conhece: o caminho entre a prova de conceito e a IA que funciona todo dia. Muitos projetos de IA param logo depois da prova de conceito. O Gartner chegou a prever que pelo menos 30% dos projetos de IA generativa seriam abandonados nessa fase até o fim de 2025. E o obstáculo raramente é o modelo: é tudo o que existe em volta dele. Manter um modelo monitorado e alinhado ao negócio pode custar muito mais do que o próprio código do modelo. É a chamada dívida técnica oculta. Levar uma tecnologia do piloto ao uso confiável é um problema antigo da gestão de tecnologia. Para isso existem os processos de stage-gate, os níveis de maturidade tecnológica (TRL) e a ISO 56002. Só que a IA complica esse problema: o comportamento dela muda quando os dados mudam, e boa parte do valor e do risco aparece depois do lançamento. Por isso, a IA pede gestão durante todo o ciclo de vida. Já existem vários frameworks para esse caminho, como o CRISP-ML(Q), o MLOps, o MLTRL, o NIST AI RMF e a ISO/IEC 42001. Mas eles não se encaixam: misturam níveis e definem as fases de jeitos diferentes. E ninguém tinha verificado quais etapas recebem orientação prática e quais ficam vagas. Este estudo fez isso, com quatro perguntas. Quais frameworks existem? Como eles organizam etapas e atividades? Onde a orientação converge e onde ela falha? E como isso muda entre setores? Para analisar esses frameworks, o estudo usa duas lentes. A primeira são as capacidades dinâmicas: para manter o valor da IA, uma organização precisa perceber mudanças, aproveitar oportunidades e se transformar quando as condições mudam. A segunda são os objetos de fronteira: artefatos compartilhados, como requisitos e documentação, que permitem que as áreas técnica, de negócio, de gestão e de auditoria trabalhem juntas. Agora, como o estudo foi feito. A revisão seguiu o protocolo PRISMA. As buscas foram feitas em junho de 2025, no Scopus, no OpenAlex e no Crossref, com estudos de 2020 em diante. Foram 3.467 registros. Um filtro estatístico manteve 705. Um modelo de linguagem fez uma pré-triagem, e toda inclusão ou dúvida passou por revisão manual. No fim, a triagem manteve 26 estudos, a busca por citações acrescentou 16, e os autores incluíram mais 2. São 44 propostas. Primeira pergunta: o que existe? São 4 sínteses, 9 aplicações em domínios específicos e 31 modelos conceituais. A maior família é a dos frameworks de governança, que falam mais de princípios do que de mecanismos para fazê-los valer. E a validação é fraca: só 7 dos 44 estudos foram validados além de um único caso. Segunda pergunta: como o trabalho é organizado? Harmonizando as 44 propostas, o estudo chegou a 10 etapas e 23 atividades, do entendimento do negócio até o monitoramento e o impacto do uso. Três ciclos de retorno se repetem: o impacto do uso revisa os requisitos, a avaliação do modelo revisa os dados, e a deriva detectada no monitoramento dispara o retreinamento. Mas esses ciclos aparecem como intenção. Raramente se diz quem, como e com que artefato eles acontecem. Terceira pergunta, e o coração do estudo: onde a orientação converge e onde ela falha? A cobertura se divide em três faixas. No centro, o núcleo técnico, quase saturado: implantação em 98% das propostas, avaliação em 93% e treinamento em 91%. Em volta, um perímetro de dados e responsabilidade: preparação de dados, justiça e viés, e monitoramento, com 80% cada. E, na periferia, as atividades negligenciadas, cobertas por menos de 1/3 das propostas. Gestão dedicada: 9%. Linhagem de dados: 14%. Inferência e otimização: 20%. Testes: 25%. Documentação: 27%. Governança de modelos: 32%. Repare: são justamente as atividades que mantêm um modelo funcionando depois da entrega. Há também uma assimetria normativa. Justiça e viés têm 80% de cobertura; governança de modelos, só 32%. Os princípios de IA responsável aparecem na maioria das propostas, mas as políticas e as evidências de auditoria que os fariam valer aparecem em menos de 1/3. Quarta pergunta: os setores mudam esse quadro? Mudam a ênfase, não as etapas. Setores regulados focam em evidências de conformidade. Na saúde entram equidade e descomissionamento. Em finanças, a documentação vira gestão de risco de modelos. E na IA generativa a prática muda dentro das etapas, com avaliação humana, testes adversariais e riscos como a injeção de instruções. O que isso significa para quem gerencia IA? Primeiro: a parada depois da prova de conceito coincide com uma lacuna de orientação. As etapas menos cobertas são justamente aquelas em que os profissionais relatam mais atrito. O estudo mediu a literatura, não causa e efeito, mas o padrão é claro. Pelas capacidades dinâmicas: aproveitar é forte no técnico e fraco na integração, perceber é desigual, e transformar quase se resume a monitorar e retreinar. Ou seja, adotar um framework não entrega uma camada de gestão pronta. Ela precisa ser desenhada. Segundo: as lacunas têm a mesma estrutura. Elas aparecem onde a informação e a responsabilidade cruzam fronteiras entre áreas. E cada fronteira pede um artefato padronizado, que sirva de evidência. Um registro de tradução de métricas, do negócio para a área técnica. Um caso de garantia, das normas para a engenharia. Um contrato de monitoramento, do teste para o uso real. E um pacote de evidências, do desenvolvimento para a auditoria. Daí vem a proposta do estudo: um framework de portões que acopla a maturidade técnica à governança. Embaixo, a progressão técnica do MLTRL, da prova de conceito à operação sustentada. Em cima, as rotinas do sistema de gestão da ISO/IEC 42001: planejar, fazer, checar e agir. E no meio, três portões. Da prova de conceito ao piloto: o registro de tradução de métricas e o escopo inicial de garantia. Do piloto à produção: o caso de garantia e o pacote de evidências. E na operação sustentada: o contrato de monitoramento e o registro de reconfiguração e descarte. A regra é simples: cada portão exige evidências de gestão, e não só o desempenho do modelo. Todo estudo tem limites. Harmonizar termos envolve interpretação. A triagem automática pode introduzir viés, embora uma amostra tenha sido conferida à mão. A busca usou termos de ciclo de vida, e estudos de gestão indexados de outra forma podem ter ficado de fora. E o framework de portões ainda não foi validado na prática. Resumindo: 44 propostas, 10 etapas e 23 atividades. O campo converge na modelagem técnica e deixa a gestão, a documentação, a linhagem e a governança pouco especificadas. O próximo passo é validar os portões em organizações reais. Para levar: um modelo que passa na prova de conceito ainda não é uma IA que funciona todo dia. O que faz essa passagem são as evidências de gestão. Obrigada pela atenção."
