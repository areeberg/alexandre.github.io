summary:
  en: >-
    PhD in Artificial Intelligence who translates cutting-edge AI into tangible solutions for industrial and
    corporate challenges, with a focus on trustworthy systems. As AI Corporate Manager at Starian and former
    Head of AI at Fundação CERTI, I lead AI governance, regulatory compliance and the maturity of AI-based
    products. As a GPAI AI Expert, I bridge deep technical research and international policy. I have led
    international research collaborations, secured funding for high-impact projects (R$ 40M+ in R&D across
    20+ companies) and advised leadership on the strategic application and risks of emerging technologies.
    My postdoctoral research at UFSC characterises the AI lifecycle on the Technology Readiness Level scale.
  pt: >-
    Doutor em Inteligência Artificial que transforma IA de ponta em soluções concretas para desafios
    industriais e corporativos, com foco em sistemas confiáveis. Como Gerente Corporativo de IA na Starian e
    ex-head de IA na Fundação CERTI, lidero governança de IA, conformidade regulatória e a maturidade de
    produtos com IA. Como especialista em IA do GPAI, faço a ponte entre pesquisa técnica e política
    internacional. Liderei colaborações internacionais de pesquisa, captei recursos para projetos de alto
    impacto (mais de R$ 40 milhões em P&D, em mais de 20 empresas) e assessorei lideranças sobre o uso
    estratégico e os riscos de tecnologias emergentes. No pós-doutorado na UFSC, caracterizo o ciclo de vida
    da IA na escala de Technology Readiness Level.

