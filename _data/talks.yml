- id: dss-curitiba-2026
  status: upcoming
  date: 2026-10
  event: Data Science Summit 2026
  city: Curitiba, PR
  en:
    kind: Talk
    title: "Corporate Governance: a method to operationalise the NIST AI RMF in AI stage-gate decisions"
    text: "The NIST AI RMF describes what AI risk governance must achieve, but not how to get there at each stage of a project. This talk presents Governança Corporativa, an instrument that brings together the AI lifecycle, MLTRL (technology readiness levels) and MLOps maturity in a single auditable reference. The result is an objective gate procedure: for each stage, the method defines the five elements that decide whether an AI project is ready to move on, and a weakest-component rule keeps an average from masking the system's real risk. It does not replace the NIST AI RMF; the two are used together, one for high-level governance and the other to turn that governance into objective decision criteria across the AI lifecycle, so the organisation can decide, in an auditable way, when to advance, review or stop an AI initiative."
  pt:
    kind: Palestra
    title: "Governança Corporativa: um método para operacionalizar o NIST AI RMF em decisões de stage-gate de IA"
    text: "O NIST AI RMF descreve o que a governança de risco de IA deve alcançar, mas não especifica como chegar lá em cada estágio de um projeto. Esta palestra apresenta o Governança Corporativa, um instrumento que reúne o ciclo de vida de IA, o MLTRL (níveis de prontidão técnica) e a maturidade MLOps em uma única referência auditável. O resultado é um procedimento de portão objetivo: para cada estágio, o método define os cinco elementos que decidem se um projeto de IA está pronto para avançar, e a regra do componente mais fraco evita que uma média mascare o risco real do sistema. A proposta não substitui o NIST AI RMF: os dois são usados em conjunto, um para a governança em alto nível e outro para transformar essa governança em critérios objetivos de decisão ao longo do ciclo de vida, para que a organização decida, de forma auditável, quando avançar, revisar ou interromper uma iniciativa de IA."
- id: workshop-ia-juridico
  status: delivered
  date: 2026-10
  event: OAB Subseção Juína
  city: Juína, MT
  featured: true
  en:
    kind: Workshop
    title: AI in legal work
    text: "A hands-on workshop for lawyers: from a client's voice note to a fee agreement, a dated case chronology with page references, a devil's-advocate review of one's own brief, citation checking, and the ethics, LGPD and data-protection rules that apply when the lawyer signs."
    modules:
      - How language models work, in six intuitions
      - "Contracts: from the client's audio to the fee agreement"
      - "Case files: a chronology with page of origin"
      - "Devil's advocate: where my brief falls apart"
      - "Citations: legal research without sanctions"
      - Ethics, LGPD and data protection
  pt:
    kind: Workshop
    title: IA no trabalho jurídico
    text: "Workshop prático para advogados: do áudio da cliente ao contrato de honorários, a cronologia do acervo com página de origem, o advogado do diabo da própria peça, a checagem de citações e as regras de ética, LGPD e proteção de dados, porque quem assina responde."
    modules:
      - Como o modelo funciona, em seis intuições
      - "Contrato: do áudio da cliente ao contrato de honorários"
      - "Acervo: a cronologia com página de origem"
      - "Advogado do diabo: por onde a minha peça cai"
      - "Citações: pesquisa jurídica sem multa"
      - Ética, LGPD e proteção de dados
