- id: tdc-florianopolis-2026
  status: delivered
  date: ""   # CONFIRMAR: mês da edição de Florianópolis
  event: TDC Florianópolis 2026
  city: Florianópolis, SC
  en:
    kind: Talk
    title: "Strategic AI Management: from Plan to Results with People and GenAI"
    text: "How to structure and operationalise an AI strategic plan aligned with the company's goals. A complete, repeatable flow: from the macro AI plan to team and individual OKRs refined with the team, through a personal SWOT analysis, development plans tied to the goals and follow-up in 1:1s supported by AI agents, with AI Skills accelerating each step. The session closes with a public repository of all the examples and Skills, ready to apply to your own team."
  pt:
    kind: Palestra
    title: "Gestão Estratégica de IA: do Plano aos Resultados com Pessoas e GenAI"
    text: "Como estruturar e operacionalizar um plano estratégico de IA alinhado aos objetivos da empresa. Um fluxo completo e replicável: do plano macro de IA aos OKRs de time e individuais, refinados com a equipe, passando por análise SWOT pessoal, PDIs conectados às metas e acompanhamento via 1:1s com suporte de agentes de IA, com Skills de IA acelerando cada etapa. Ao final, um repositório público com todos os exemplos e Skills para aplicar diretamente na sua equipe."
