---
layout: default
title: Blog
permalink: /blog/
---
<div class="pagina">
  <section class="secao">
    <div class="cabeca-secao">
      <p class="anotacao">todos os textos</p>
      <h1 class="display">Blog</h1>
    </div>
    <ul class="lista-posts">
      {% for post in site.posts %}
      <li class="post-item">
        <span class="legenda">{{ post.date | date: "%d/%m/%Y" }}</span>
        <div>
          <h2 class="titulo-2"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
          <p>{{ post.excerpt | strip_html | truncate: 160 }}</p>
          <div class="tags">{% for tag in post.tags %}<span class="ka-buzio"><span class="ka-buzio__ponto"></span>{{ tag }}</span>{% endfor %}</div>
        </div>
      </li>
      {% endfor %}
    </ul>
  </section>
</div>
