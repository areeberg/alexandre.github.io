<!DOCTYPE html>
<html lang="pt-BR" data-theme="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != '/' %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/kauri.css' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/AbrilFatface-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('kauri-tema');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>
  {% include cabecalho.html %}
  <main id="conteudo">
    {{ content }}
  </main>
  {% include rodape.html %}
  <script>
    document.getElementById('tema').addEventListener('click', function () {
      var el = document.documentElement;
      var t = el.getAttribute('data-theme') === 'escuro' ? 'claro' : 'escuro';
      el.setAttribute('data-theme', t);
      try { localStorage.setItem('kauri-tema', t); } catch (e) {}
    });
  </script>
</body>
</html>
